[package]
name = "indistinguishability"
version = "0.2.0"
edition = "2024"

[dependencies]

# own crates
utils = { path = "../utils", features = ["serde"]}
logic_formula = {path = "../logic_formula", features = ["egg", "serde"]}
egg = {path = "../egg", features = ["serde-1"]}
golgge = {path = "../golgge"}
cryptovampire_macros = {path = "../cryptovampire_macros"}
cryptovampire_smt = {path = "../cryptovampire_smt", features = ["vampire", "macro"]}

# workspace
itertools.workspace = true
static_init.workspace = true
paste.workspace = true
anyhow.workspace = true
smallvec.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
bitflags= {workspace = true, features = ["serde"]}
tempfile.workspace = true
which.workspace = true
bon.workspace = true



im-rc = "15"
rustc-hash = "2.1.0" # for hash on integers
indexmap = "2.7.0"
serde_json = "1.0.120"
num_cpus = "1.17.0"
steel-core = { git = "https://github.com/mattwparas/steel" }
steel-derive = { git = "https://github.com/mattwparas/steel"}

[patch.crates-io]
lasso = { git = "https://github.com/lcnr/lasso/", branch = "patch-1" }

[lints]
workspace = true