[workspace]
members = [
  "crates/cryptovampire",
  "crates/utils",
  "crates/logic_formula",
  "crates/cryptovampire_macros",
  "crates/indistinguishability",
  # "crates/indistinguishability2",
]
resolver = "2"
# authors = ["Simon Jeanteur <7871851+puyral@users.noreply.github.com>"]
default-members = ["crates/cryptovampire"]

[workspace.dependencies]
itertools = "0.13"
if_chain = "1.0.2"
hashbrown = "0.15"
log = { version = "0.4", features = ["release_max_level_warn"] }
static_init = "1.0"
paste = "1.0"
thiserror = "2.0"
macro-attr = "0.2"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
derive_builder = "0.20"
bitflags = "2.6"
smallvec = {version = "1.8.0", features = ["union", "const_generics"]}
env_logger = "0.11"

[workspace.lints.rust]
elided_lifetimes_in_paths = "deny"

[profile.profiling]
inherits = "release"
debug = true